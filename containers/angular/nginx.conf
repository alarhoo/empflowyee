worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Only fingerprinted assets are immutable; configuration and HTML must refresh.
  map $uri $cache_control {
    default 'no-cache';
    /assets/config.json 'no-store';
    /health/live 'no-store';
    /health/ready 'no-store';
    '~*-[a-z0-9]{8,}\.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$' 'public, max-age=31536000, immutable';
  }

  server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health/live {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    location = /health/ready {
      access_log off;
      default_type text/plain;
      return 200 'ready';
    }

    location = /assets/config.json {
      try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
      try_files $uri =404;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
