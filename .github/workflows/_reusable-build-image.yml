# Publish a commit image once; retries reuse its immutable digest for later promotion.
name: _ Reusable - Build Container Image
# Called once for each deployable selected by the release matrix.
on:
  workflow_call:
    inputs:
      project_name:
        description: Deployable Nx project key from ci/deployables.json.
        required: true
        type: string
      release_sha:
        description: Full lowercase commit SHA matching the calling workflow's main commit.
        required: true
        type: string
    # Expose immutable coordinates so later promotion can use the exact published artifact.
    outputs:
      image_ref:
        description: Immutable Artifact Registry image reference.
        value: ${{ jobs.build.outputs.image_ref }}
      image_digest:
        description: Immutable image digest.
        value: ${{ jobs.build.outputs.image_digest }}
# Repository reads plus OIDC are sufficient; no Git write permission or stored cloud key.
permissions:
  contents: read
  id-token: write

jobs:
  # Gate publishing on main and explicit activation after the cloud prerequisites exist.
  build:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    # The central CICD environment owns the build identity and Artifact Registry coordinates.
    environment: cicd
    # Translate the reusable-workflow contract into inputs understood by tools/ci/release.mjs.
    env:
      RELEASE_MODE: build
      RELEASE_SHA: ${{ inputs.release_sha }}
      DEPLOYABLE: ${{ inputs.project_name }}
      AR_PROJECT_ID: ${{ vars.AR_PROJECT_ID }}
      AR_REGION: ${{ vars.AR_REGION }}
      AR_REPOSITORY: ${{ vars.AR_REPOSITORY }}
      CICD_WIF_PROVIDER: ${{ vars.CICD_WIF_PROVIDER }}
      CICD_BUILD_SERVICE_ACCOUNT: ${{ vars.CICD_BUILD_SERVICE_ACCOUNT }}
    # Forward the helper outputs from this job to the workflow-level output contract.
    outputs:
      image_ref: ${{ steps.image.outputs.ref }}
      image_digest: ${{ steps.image.outputs.digest }}
    steps:
      # Preserve main history for the helper's commit and ancestry validation.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Nx executes the official Docker target using the pinned repository toolchain.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Require a production Dockerfile and a build SHA matching this workflow commit.
      - name: Validate release and prerequisites before authentication
        run: node tools/ci/release.mjs validate
      - uses: pnpm/action-setup@v6
      # Install before cloud authentication; package build hooks receive no cloud credentials.
      - name: Install the Nx toolchain
        run: pnpm install --frozen-lockfile
      # Obtain short-lived credentials for the central artifact publishing identity.
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.AR_PROJECT_ID }}
          workload_identity_provider: ${{ vars.CICD_WIF_PROVIDER }}
          service_account: ${{ vars.CICD_BUILD_SERVICE_ACCOUNT }}
      # Provide registry inspection and Docker authentication through gcloud.
      - uses: google-github-actions/setup-gcloud@v3
      # Reuse an existing commit tag on retry; otherwise build, push and resolve its digest.
      - name: Build or reuse immutable release image
        id: image
        run: node tools/ci/release.mjs
