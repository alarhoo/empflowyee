# Validate pull requests before merge; this workflow never deploys or authenticates to GCP.
name: PR CI

# Recheck title edits as well as code updates on pull requests targeting main.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - main

# Validation only needs read access to the repository.
permissions:
  contents: read

# Superseded PR checks may be cancelled because they do not publish or deploy anything.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Enforce the Conventional Commit title that will describe the eventual squash merge.
  validate-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate Conventional Commit-style PR title
        # Pass untrusted PR text as data, rather than interpolating it into executable source.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node - <<'NODE'
          const title = process.env.PR_TITLE ?? '';
          const pattern = /^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)\([a-z0-9-]+\)!?: \S[^\r\n]*$/;
          if (!pattern.test(title)) {
            console.error(`Invalid PR title: ${title}`);
            console.error('Expected example: feat(hcm-leave): add leave application flow');
            process.exit(1);
          }
          NODE

  # Check repository policies, then lint/test/build only projects affected by this PR.
  affected-quality:
    name: Nx affected quality
    runs-on: ubuntu-latest
    steps:
      # Nx needs the base/head history; later commands do not need persisted Git credentials.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Use the pinned Node runtime and let pnpm handle the declared package-manager version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - uses: pnpm/action-setup@v6

      # Frozen installation rejects dependency changes that were not recorded in the lockfile.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Verify project identities, source-of-truth documents and the seven-deployable manifest.
      - name: Validate repository architecture
        run: node tools/architecture/verify.mjs

      - name: Validate documentation
        run: node tools/documentation/verify.mjs

      - name: Validate deployment manifest
        run: node tools/ci/validate-deployables.mjs

      # Root tooling is outside Nx app lint targets, so enforce its rules explicitly.
      - name: Lint tooling and test function-documentation policy
        run: |
          pnpm lint:tooling
          pnpm test:lint-policy
          node --test tools/ci/*.test.mjs

      # Verify the pinned actionlint download before checking YAML, expressions and shell steps.
      - name: Validate GitHub workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --dir "$RUNNER_TEMP/actionlint" \
            --pattern 'actionlint_1.7.12_linux_amd64.tar.gz' --pattern 'actionlint_1.7.12_checksums.txt'
          (cd "$RUNNER_TEMP/actionlint" && sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt)
          tar -xzf "$RUNNER_TEMP/actionlint/actionlint_1.7.12_linux_amd64.tar.gz" -C "$RUNNER_TEMP/actionlint"
          "$RUNNER_TEMP/actionlint/actionlint"

      # Use the PR's exact base/head SHAs for formatting and affected-project selection.
      - name: Check formatting for changed files
        run: pnpm nx format:check --base="${{ github.event.pull_request.base.sha }}" --head="${{ github.event.pull_request.head.sha }}"

      - name: Lint, test and build affected projects
        run: pnpm nx affected -t lint test build --base="${{ github.event.pull_request.base.sha }}" --head="${{ github.event.pull_request.head.sha }}" --parallel=3
