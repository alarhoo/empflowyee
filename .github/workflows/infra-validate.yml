name: Infrastructure Validate
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.terraform-version'
      - '.github/workflows/infra-*.yml'
permissions:
  contents: read

jobs:
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root: [shared, environments/dev, environments/qa, environments/prod]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Read Terraform version
        id: terraform
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      - name: Test plans with mocked providers
        run: terraform test

  bootstrap-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: shellcheck infra/bootstrap/*.sh
      - run: node --test infra/bootstrap/*.test.mjs
