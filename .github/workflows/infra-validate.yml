# Validate infrastructure changes with mock providers and fake gcloud commands; no live apply.
name: Infrastructure Validate
# Run only when infrastructure code, Terraform version or infrastructure workflows change.
on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'
      - '.terraform-version'
      - '.github/workflows/infra-*.yml'
      - 'tools/cloud-run/**'
# Read-only repository access is sufficient; no cloud identity or state access is granted.
permissions:
  contents: read

jobs:
  # Validate and test each independently deployed Terraform root.
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        root:
          [
            shared,
            environments/dev,
            environments/qa,
            environments/prod,
            cloud-run/dev,
            cloud-run/qa,
            cloud-run/prod,
          ]
    # Execute Terraform inside the selected root so its lockfile and tests are used.
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.root }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Read the single version pin from the repository root before installing Terraform.
      - name: Read Terraform version
        id: terraform
        working-directory: .
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.terraform.outputs.version }}
      # Check formatting and provider-locked configuration without connecting to the state backend.
      - run: terraform fmt -check -recursive
      # Shared modules sit outside each root, so check their formatting explicitly too.
      - run: terraform fmt -check -recursive ../modules
        working-directory: infra/terraform/cloud-run
      - run: terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform validate
      # Exercise plan invariants using mocked providers instead of real GCP resources.
      - name: Test plans with mocked providers
        run: terraform test

  # Check shell syntax and verify bootstrap guards through isolated fake-cloud regression tests.
  bootstrap-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: shellcheck infra/bootstrap/*.sh
      - run: node --test infra/bootstrap/*.test.mjs
      # Compare the Cloud Run catalog with the release/container manifests without cloud credentials.
      - run: node tools/cloud-run/verify-foundation.mjs
