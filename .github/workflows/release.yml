name: Build Release Artifacts
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all seven deployables instead of Nx affected only.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.RELEASE_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - name: Validate deployment manifest
        run: node tools/ci/validate-deployables.mjs
      - name: Determine affected deployable projects
        id: affected
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BUILD_ALL: ${{ inputs.build_all }}
          NX_DAEMON: 'false'
          NX_TUI: 'false'
        run: |
          if [[ "$EVENT_NAME" == push && -n "$BEFORE_SHA" && "$BEFORE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            BASE="$BEFORE_SHA"
          elif git rev-parse --verify HEAD^ > /dev/null 2>&1; then
            BASE="$(git rev-parse HEAD^)"
          else
            BUILD_ALL=true
            BASE="$GITHUB_SHA"
          fi

          # These build inputs sit outside application roots in the Nx graph.
          if git diff --name-only "$BASE" "$GITHUB_SHA" -- .dockerignore ci/deployables.json .github/workflows/release.yml .github/workflows/_reusable-build-image.yml tools/ci | grep -q .; then
            BUILD_ALL=true
          fi

          if [[ "$BUILD_ALL" == true ]]; then
            PROJECTS="$(node -e "process.stdout.write(Object.keys(require('./ci/deployables.json').deployables).join(','))")"
          else
            PROJECTS="$(pnpm nx show projects --affected --type app --base="$BASE" --head="$GITHUB_SHA" --sep=",")"
          fi
          printf 'projects=%s\n' "$PROJECTS" >> "$GITHUB_OUTPUT"
      - name: Build release matrix
        id: matrix
        env:
          AFFECTED_PROJECTS: ${{ steps.affected.outputs.projects }}
        run: node tools/ci/build-release-matrix.mjs >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.project }}
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    uses: ./.github/workflows/_reusable-build-image.yml
    with:
      project_name: ${{ matrix.project }}
      release_sha: ${{ github.sha }}

  summary:
    name: Release summary
    needs: [prepare, build]
    if: always() && github.ref == 'refs/heads/main' && vars.RELEASE_PIPELINE_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      PREPARE_RESULT: ${{ needs.prepare.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      DEPLOYABLE_COUNT: ${{ needs.prepare.outputs.count }}
    steps:
      - name: Summary
        shell: bash
        run: |
          {
            printf '## empFLOWyee release\n\n'
            printf -- '- Commit: %s\n' "$GITHUB_SHA"
            printf -- '- Selected deployables: %s\n' "$DEPLOYABLE_COUNT"
            printf -- '- Preparation: %s\n- Build: %s\n' "$PREPARE_RESULT" "$BUILD_RESULT"
            printf -- '- Deployment: **none**\n\n'
            if [[ "$PREPARE_RESULT" == success && "$BUILD_RESULT" == success ]]; then
              printf 'Published digests are recorded in each build job summary.\n'
            elif [[ "$PREPARE_RESULT" == success && "$DEPLOYABLE_COUNT" == 0 ]]; then
              printf 'No deployables were affected; no release artifacts were created.\n'
            else
              printf 'Release incomplete. Inspect failed jobs before selecting an artifact for promotion.\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
