packages:
  - 'apps/**'
  - 'libs/**'
  - 'tools/**'

# pnpm 11+/12 can auto-install when a script sees dependency drift. We want
# dependency changes to be explicit and reviewable in this repository.
verifyDepsBeforeRun: warn

# pnpm 12 is fail-closed for dependency lifecycle/build scripts. Every package
# that declares one must be explicitly reviewed as either allowed (true) or
# denied (false). This list follows the current Nx/Angular toolchain policy for
# the transitive build-script packages we expect in this workspace.
#
# IMPORTANT: do not replace this with a blanket approval. If a new dependency
# appears in ERR_PNPM_IGNORED_BUILDS later, review it and add an explicit entry.
allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': false
  '@scarf/scarf': false
  '@swc/core': false
  '@tailwindcss/oxide': false
  core-js: false
  core-js-pure: false
  cypress: false
  detox: false
  dtrace-provider: false
  es5-ext: false
  esbuild: false
  less: false
  lmdb: false
  msgpackr-extract: false
  nx: true
  sharp: false
  unrs-resolver: false
