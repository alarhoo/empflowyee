<ui5-user-menu
	[open]="open()"
	[opener]="opener()"
	(ui5Close)="closed.emit()"
	(ui5SignOutClick)="signOut()">
	<ui5-user-menu-account
		slot="accounts"
		[selected]="true"
		[titleText]="runtime.context()?.user.displayName"
		[subtitleText]="runtime.context()?.user.email"
		[description]="runtime.tenant()?.displayName"
		[avatarSrc]="runtime.context()?.user.avatarUrl"
		[avatarInitials]="initials()"></ui5-user-menu-account>
	<ui5-user-menu-item
		text="My profile"
		icon="employee"
		(ui5Click)="openProfile()"></ui5-user-menu-item>
	<ui5-user-menu-item
		text="Settings"
		icon="action-settings"
		(ui5Click)="settings()"></ui5-user-menu-item>
</ui5-user-menu>
@if (settingsOpen()) {
	<ef-hcm-settings (closed)="settingsOpen.set(false)"></ef-hcm-settings>
}
